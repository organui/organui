version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    # The model build scripts keep their own lockfiles outside the workspace.
    directories: ["/", "/models", "/scripts/models", "/scripts/models/joints"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Types follow the oldest supported Node (engines), not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    # The dermatome map generator, run by hand like the model scripts.
    directory: /packages/registry/scripts
    schedule:
      interval: weekly
