name: Browser tests
# The docs site, built as Vercel builds it, in Chromium. Split three ways:
# it has the most tests.
on:
  pull_request:
    paths: &site
      - "apps/web/**"
      - "packages/registry/**"
      - "packages/ui/**"
      - "packages/registry-e2e/**"
      - "packages/eslint-config/**"
      - "packages/typescript-config/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".nvmrc"
      - "scripts/**"
      - ".github/actions/**"
      - ".github/workflows/browser-tests.yml"
  push:
    branches: [master]
    paths: *site
  # Run any branch without opening a PR: gh workflow run browser-tests.yml --ref <branch>
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  docs:
    name: bun run test:browser (docs ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Shared with the consumers, which build the same tasks.
      - uses: ./.github/actions/setup
        with:
          turbo-cache: verify
      - run: bun scripts/vercel-build.ts
      - if: matrix.shard == 1
        run: bun run test:cache
      - uses: ./.github/actions/playwright
      # Turbo reuses the cached website build.
      - run: bun run test:browser --log-order=stream
        env:
          BROWSER_SUITE: docs
          BROWSER_SHARD: ${{ matrix.shard }}/3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures-docs${{ matrix.shard }}
          path: packages/registry-e2e/test-results
          if-no-files-found: ignore
