name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    name: GitHub release for the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Releases written by hand keep their notes. A tag pushed without one
      # gets a release with notes generated from the merged pull requests.
      - run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
