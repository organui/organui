name: Registry foundation
on:
  # Prose that no build, test or page reads. Changesets aren't listed: the
  # checks job verifies them.
  pull_request:
    paths-ignore: &prose
      - "*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  push:
    branches: [master]
    paths-ignore: *prose
  # Run any branch without opening a PR: gh workflow run registry.yml --ref <branch>
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: Format, lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # History for --affected, which compares a pull request with its base.
        # Neither job pushes, so the token isn't kept in the checkout.
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      # Turbo's local cache, kept between runs so unchanged packages replay.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-${{ github.job }}-
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      # A pull request that changes what the registry installs carries a
      # changeset, which becomes its line in the release notes.
      - if: github.event_name == 'pull_request'
        run: bunx changeset status --since=origin/${{ github.base_ref }}
      # Pull requests check only the packages they change and their dependents;
      # master checks everything.
      - run: bunx turbo run lint typecheck test ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  verify:
    name: Build, cache and installed consumers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      # Turbo's local cache, kept between runs so unchanged packages replay.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-${{ github.job }}-
      - run: bun install --frozen-lockfile
      - run: bun scripts/vercel-build.ts
      - run: bun run test:cache
      # The browser download, keyed on the lockfile that pins Playwright.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      # The system packages it installs (fonts, Xvfb, NSS) are kept too: an
      # Ubuntu mirror can serve them at a few kB/s, which has taken 11 minutes.
      # Keyed on the runner image, whose package versions they match; apt
      # downloads only what changed since.
      - id: runner-image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-archives
          key: ${{ runner.os }}-playwright-deps-${{ steps.runner-image.outputs.version }}-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-deps-
      - run: |
          mkdir -p ~/.cache/apt-archives/partial
          printf 'Dir::Cache::Archives "%s";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' ~/.cache/apt-archives \
            | sudo tee /etc/apt/apt.conf.d/99playwright-cache
      - run: bunx playwright install --with-deps chromium
        working-directory: packages/registry-e2e
      # apt writes as root; the cache is saved as the runner user.
      - run: sudo chown -R "$USER" ~/.cache/apt-archives
      # Turbo generates the consumers and reuses the cached website build.
      - run: bun run test:browser --log-order=stream
        env:
          REGISTRY_GITHUB_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures
          path: packages/registry-e2e/test-results
          if-no-files-found: ignore
