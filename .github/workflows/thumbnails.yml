name: Organ thumbnails
# Renders the /organs gallery thumbnails and opens a pull request with them:
#   gh workflow run thumbnails.yml --ref <branch> [-f only=heart,brain]
# The pull request targets the branch the workflow ran on.
on:
  workflow_dispatch:
    inputs:
      only:
        description: Organs to render, comma-separated (default all)
        required: false
        default: ""
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  render:
    name: Render and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run thumbnails ${ONLY:+--only "$ONLY"}
        working-directory: apps/web
        env:
          ONLY: ${{ inputs.only }}
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          RUN: ${{ github.run_id }}
        run: |
          if git diff --quiet -- apps/web/public/organs apps/web/lib/organ-thumbnails.json && \
             [ -z "$(git ls-files --others --exclude-standard apps/web/public/organs)" ]; then
            echo "Thumbnails are up to date."
            exit 0
          fi
          branch="thumbnails/$RUN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add apps/web/public/organs apps/web/lib/organ-thumbnails.json
          git commit -m "Regenerate organ thumbnails"
          git push origin "$branch"
          gh pr create --base "$BASE" --head "$branch" \
            --title "Regenerate organ thumbnails" \
            --body "Rendered by the Organ thumbnails workflow (run $RUN). Each thumbnail keeps its model's licence, recorded in \`apps/web/lib/organ-thumbnails.json\`."
