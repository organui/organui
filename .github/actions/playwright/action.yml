name: Set up Playwright
description: Chromium and the system packages it needs, both cached.
runs:
  using: composite
  steps:
    # The browser download, keyed on the lockfile that pins Playwright.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
    # The system packages it installs (fonts, Xvfb, NSS) are kept too: an
    # Ubuntu mirror can serve them at a few kB/s, which has taken 11 minutes.
    # Keyed on the runner image, whose package versions they match; apt
    # downloads only what changed since.
    - id: runner-image
      run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/apt-archives
        key: ${{ runner.os }}-playwright-deps-${{ steps.runner-image.outputs.version }}-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-playwright-deps-
    - run: |
        mkdir -p ~/.cache/apt-archives/partial
        printf 'Dir::Cache::Archives "%s";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' ~/.cache/apt-archives \
          | sudo tee /etc/apt/apt.conf.d/99playwright-cache
      shell: bash
    - run: bunx playwright install --with-deps chromium
      working-directory: packages/registry-e2e
      shell: bash
    # apt writes as root; the cache is saved as the runner user.
    - run: sudo chown -R "$USER" ~/.cache/apt-archives
      shell: bash
